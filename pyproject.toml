[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "kafka-oncall"
version = "0.1.0"
description = "Replay and evaluate Kafka/KEDA scaling investigations."
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]

[project.scripts]
kafka-oncall = "kafka_oncall.cli:main"

[tool.setuptools.packages.find]
include = ["kafka_oncall"]
